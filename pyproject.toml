[project]
name = "agents"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "ag-ui-adk>=0.6.5",
  "asyncpg>=0.30.0",
  "fastapi",
  "google-adk[mcp]>=2.2.0",
  "google-genai",
  "httpx",
  "litellm",
  "opentelemetry-api",
  "opentelemetry-exporter-otlp-proto-http",
  "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
  "opentelemetry-sdk",
  "pydantic",
  "pyjwt[crypto]>=2.10",
  "python-dotenv",
  "google-cloud-bigquery>=3.35.0,<4.0.0",
  "jinja2>=3.1.6,<4.0.0",
  "sqlalchemy[asyncio]>=2.0",
  "uvicorn[standard]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single distribution that installs every agent's `src` package, so imports like
# `gateway.main` / `resume_agent.main` / `agents_shared` resolve from the venv.
# `uv sync` installs this editable, so src edits are picked up live and no
# PYTHONPATH / sys.path wiring is needed anywhere (Docker, Railway, or pytest).
[tool.hatch.build.targets.wheel]
packages = [
  "agents/excalidraw/src/excalidraw_agent",
  "agents/expense/src/expense_agent",
  "agents/fitness/src/fitness_agent",
  "agents/gateway/src/gateway",
  "agents/grocery/src/grocery_agent",
  "agents/oralboards/src/oralboards_agent",
  "agents/presentation/src/presentation_agent",
  "agents/research/src/research_agent",
  "agents/resume/src/resume_agent",
  "agents/shared/src/agents_shared",
  "agents/spreadsheet/src/spreadsheet_agent",
  "agents/travel/src/travel_agent",
  "agents/trends/src/trends_agent",
  "agents/wellness/src/wellness_agent",
]

[tool.ruff]
target-version = "py314"
extend-exclude = [".venv", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "ASYNC", "S"]
ignore = [
  "ANN", # Runtime and framework callbacks use dynamic third-party types.
  "D", # This codebase does not require public API docstrings everywhere.
  "E501", # Long prompts and JSON examples are intentionally kept readable.
  "PLR2004", # Tests use literal status codes and compact fixture assertions.
  "S105", # Tests and examples contain non-secret token placeholder strings.
  "SLF001", # Tests validate private helpers where they are the behavior boundary.
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
  "S101", # Pytest assertion rewriting is the preferred test style.
  "S105", # Test fixtures use placeholder token strings, not real credentials.
]

[tool.pytest.ini_options]
testpaths = ["agents"]
asyncio_mode = "auto"
# Agent packages are installed editable via `uv sync` (see [build-system]), so
# tests import them straight from the venv — no pythonpath wiring needed.
addopts = ["--import-mode=importlib"]
filterwarnings = [
  # Python 3.14 / google-genai compat — not our code
  "ignore:.*_UnionGenericAlias.*:DeprecationWarning",
  # ADK API churn — BaseAgentConfig renamed upstream
  "ignore:BaseAgentConfig is deprecated:DeprecationWarning",
  # ADK experimental features used intentionally
  "ignore:.*PLUGGABLE_AUTH.*:UserWarning",
  "ignore:.*InMemoryCredentialService.*:UserWarning",
  "ignore:.*BaseCredentialService.*:UserWarning",
  "ignore:.*JSON_SCHEMA_FOR_FUNC_DECL.*:UserWarning",
  # ADK InMemoryCredentialService leaks SQLite handles during test teardown
  "ignore:.*unclosed database.*:ResourceWarning",
]

[tool.coverage.run]
source = [
  "agents/fitness/src",
  "agents/gateway/src",
  "agents/grocery/src",
  "agents/oralboards/src",
  "agents/resume/src",
  "agents/travel/src",
  "agents/wellness/src",
  "agents/shared/src",
]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = [
  "def _setup_otel",
  "async def trace_requests",
  "async def health",
  "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
  "google-cloud-aiplatform[evaluation]>=1.158.0",
  "httpx",
  "httpx2>=2.5.0",
  "pyright>=1.1",
  "pytest",
  "pytest-asyncio",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.15",
]
