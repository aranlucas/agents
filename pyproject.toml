[project]
name = "agents-workspace"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["gateway"]

[tool.uv]
package = false

[tool.uv.sources]
agent-common = { workspace = true }
a2ui-agent = { workspace = true }
fitness-agent = { workspace = true }
gateway = { workspace = true }
grocery-agent = { workspace = true }
oralboards-agent = { workspace = true }
resume-agent = { workspace = true }
travel-agent = { workspace = true }
wellness-agent = { workspace = true }

[tool.uv.workspace]
members = [
  "agents/a2ui",
  "agents/fitness",
  "agents/gateway",
  "agents/grocery",
  "agents/oralboards",
  "agents/resume",
  "agents/travel",
  "agents/wellness",
  "packages/agent-common",
]

[tool.ruff]
target-version = "py314"
extend-exclude = [".venv", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = [
  "ANN", # Runtime and framework callbacks use dynamic third-party types.
  "D", # This codebase does not require public API docstrings everywhere.
  "E501", # Long prompts and JSON examples are intentionally kept readable.
  "INP001", # Agent directories are executable service roots, not packages.
  "PLC0415", # Lazy imports avoid importing optional telemetry/database modules.
  "PLR0913", # Framework/provider factories mirror third-party constructor shapes.
  "PLR2004", # Tests use literal status codes and compact fixture assertions.
  "PLW0603", # Shared test fixtures intentionally mutate module-level state.
  "S104", # Local dev containers intentionally bind to all interfaces.
  "S105", # Tests and examples contain non-secret token placeholder strings.
  "SLF001", # Tests validate private helpers where they are the behavior boundary.
  "TRY401", # Existing logging keeps exception context explicit in dev services.
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
  "S101", # Pytest assertion rewriting is the preferred test style.
]

[tool.pytest.ini_options]
testpaths = ["agents", "packages/agent-common"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]
pythonpath = [
  "agents/a2ui/src",
  "agents/fitness/src",
  "agents/gateway/src",
  "agents/grocery/src",
  "agents/oralboards/src",
  "agents/resume/src",
  "agents/travel/src",
  "agents/wellness/src",
  "packages/agent-common/src",
]

[tool.coverage.run]
source = [
  "agents/a2ui/src",
  "agents/fitness/src",
  "agents/gateway/src",
  "agents/grocery/src",
  "agents/oralboards/src",
  "agents/resume/src",
  "agents/travel/src",
  "agents/wellness/src",
  "packages/agent-common/src",
]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = [
  "def _setup_otel",
  "async def trace_requests",
  "async def health",
  "if __name__ == .__main__.:",
]

[dependency-groups]
dev = ["httpx", "pytest", "pytest-asyncio", "pytest-cov>=7.1.0", "ruff>=0.15.15"]
