[project]
name = "agents-workspace"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "agents/a2ui",
  "agents/fitness",
  "agents/grocery",
  "agents/travel",
  "agents/wellness",
  "packages/agent-common",
]

[tool.ruff]
target-version = "py314"
extend-exclude = [".venv", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501"]

[dependency-groups]
dev = ["ruff>=0.15.15"]
