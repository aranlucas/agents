packages:
  - "apps/*"
  - "packages/*"

minimumReleaseAge: 0

allowBuilds:
  agents-monorepo: true
  "@clerk/shared": true
  "@scarf/scarf": true
  browser-tabs-lock: true
  bufferutil: true
  core-js: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true

onlyBuiltDependencies:
  - "agents-monorepo"
  - "@clerk/shared"
  - "browser-tabs-lock"
  - "bufferutil"
  - "core-js"
  - "msgpackr-extract"
  - "sharp"
  - "unrs-resolver"
  - "utf-8-validate"
  - "@scarf/scarf"
