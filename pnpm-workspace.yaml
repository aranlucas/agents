packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@clerk/shared': true
  '@scarf/scarf': true
  browser-tabs-lock: true
  bufferutil: true
  core-js: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true

onlyBuiltDependencies:
  - '@clerk/shared'
  - 'browser-tabs-lock'
  - 'bufferutil'
  - 'core-js'
  - 'sharp'
  - 'unrs-resolver'
  - 'utf-8-validate'
  - '@scarf/scarf'
