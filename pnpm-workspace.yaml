packages:
  - "apps/*"
  - "packages/*"
  - "agents"

minimumReleaseAge: 0

# Only formatting changes the source exported by injected workspace packages.
syncInjectedDepsAfterScripts:
  - fmt

overrides:
  "@huggingface/transformers>sharp": "0.35.4"
  "@modelcontextprotocol/sdk": "1.30.0"
  "jayson>uuid": "11.1.1"
  "next>postcss": "8.5.28"
  "next>sharp": "0.35.4"
  "react-native-markdown-display>markdown-it": "14.3.0"
  "xcode>uuid": "11.1.1"

allowBuilds:
  "@modelcontextprotocol/ext-apps": true
  "@mongodb-js/zstd": true
  agents-monorepo: true
  "@clerk/shared": true
  "@scarf/scarf": true
  better-sqlite3: true
  browser-tabs-lock: true
  bufferutil: true
  core-js: true
  core-js-pure: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
  onnxruntime-node: false
  protobufjs: true
  dtrace-provider: false
  esbuild: true
  msw: true
  node-liblzma: true
  workerd: true
  highlight.js: true
  "@sentry/cli": false

pmOnFail: ignore
