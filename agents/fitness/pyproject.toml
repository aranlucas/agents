[project]
name = "fitness-agent"
version = "0.1.0"
description = "Fitness training agent powered by Google ADK + CopilotKit AG-UI"
requires-python = ">=3.14"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "python-dotenv",
  "pydantic",
  "httpx",
  "google-adk>=1.34.1",
  "google-genai",
  "ag-ui-adk",
  "litellm",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-instrumentation-sqlite3",
  "opentelemetry-instrumentation-google-genai>=0.7b1",
  "opentelemetry-instrumentation-vertexai>=2.0b0",
  "a2a-sdk>=1.0.3",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[project.scripts]
app = "main:app"

[tool.setuptools]
py-modules = ["main", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
