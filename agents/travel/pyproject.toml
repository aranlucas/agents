[project]
name = "travel-agent"
version = "0.1.0"
description = "Travel planning agent powered by Google ADK + CopilotKit AG-UI"
requires-python = ">=3.14"
dependencies = [
  "agent-common",
  "fastapi",
  "uvicorn[standard]",
  "python-dotenv",
  "pydantic",
  "google-adk[a2a,mcp]>=2.2.0",
  "google-genai",
  "ag-ui-adk>=0.6.5",
  "litellm",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-instrumentation-sqlite3",
  "opentelemetry-instrumentation-google-genai>=0.7b1",
  "opentelemetry-instrumentation-vertexai>=2.0b0",
  "opentelemetry-exporter-otlp-proto-http",
  "a2a-sdk>=0.3.4,<0.4",
  "dependency-injector>=4.49.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[project.scripts]
app = "travel_agent.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"
