[project]
name = "agents-shared"
version = "0.1.0"
description = "Shared runtime helpers for the single agents gateway"
requires-python = ">=3.14"
dependencies = [
  "ag-ui-adk>=0.6.4",
  "asyncpg>=0.30.0",
  "dependency-injector>=4.49.0",
  "fastapi",
  "google-adk>=2.2.0",
  "google-genai",
  "opentelemetry-api",
  "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
  "opentelemetry-sdk",
  "pyjwt[crypto]>=2.10",
  "sqlalchemy[asyncio]>=2.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
