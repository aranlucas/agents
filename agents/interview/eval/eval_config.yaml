metrics_to_run:
  - multi_turn_task_success
  - final_response_quality
  - safety
  - project_agent_contract

custom_metrics:
  - name: project_agent_contract
    rubric_group_name: agent_contract
    judge_model: gemini-flash-latest
    judge_model_generation_config:
      temperature: 0
      http_options:
        retry_options:
          initial_delay: 1
          attempts: 2
    prompt_template: |
      You are grading a software-engineering interview coach trace.

      Score whether the agent satisfied the user's intent while following these
      project-specific rules:
      - Configure the session and select exactly one question at a time.
      - Do not reveal coding solutions before an attempt unless the user exits interview mode.
      - Give only the requested progressive hint.
      - Ground behavioral coaching in facts supplied by the user.
      - Score against all four track-specific rubric dimensions with evidence.
      - Never claim code compiled, ran, or passed tests without execution.
      - Do not complete a session before its configured question count is scored.

      Prompt: {prompt}
      Final response: {response}
      Full trace: {agent_data}

      Return JSON: {"score": <1|2|3|4|5>, "explanation": "<one concise reason>"}
