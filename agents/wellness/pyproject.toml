[project]
name = "wellness-agent"
version = "0.1.0"
description = "Wellness planning orchestrator powered by Google ADK + CopilotKit AG-UI"
requires-python = ">=3.14"
dependencies = [
  "agents-shared",
  "fitness-agent",
  "grocery-agent",
  "fastapi",
  "uvicorn[standard]",
  "python-dotenv",
  "pydantic",
  "httpx",
  "google-adk>=2.2.0",
  "google-genai",
  "ag-ui-adk>=0.6.5",
  "litellm",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-instrumentation-sqlite3",
  "opentelemetry-instrumentation-google-genai>=0.7b1",
  "opentelemetry-instrumentation-vertexai>=2.0b0",
  "opentelemetry-exporter-otlp-proto-http",
  "dependency-injector>=4.49.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"
