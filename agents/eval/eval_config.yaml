metrics_to_run:
  - task_success
  - response_quality
  - project_agent_contract

# All metrics use CodeExecutionMetric (local, no GCP required for grading).
# LLM judge calls go through LiteLLM — set EVAL_JUDGE_MODEL to override.
custom_metrics:
  - name: task_success
    custom_function: |
      def evaluate(instance):
          import json, os
          import litellm
          prompt = instance.get("prompt", "")
          resp = instance.get("response", {})
          if isinstance(resp, dict):
              response = " ".join(p.get("text", "") for p in resp.get("parts", []) if p.get("text"))
          else:
              response = str(resp)
          judge_prompt = (
              "Did the agent successfully complete the user's task?\n\n"
              f"User request: {prompt}\n"
              f"Agent response: {response}\n\n"
              "Score 1-5: 1=complete failure, 2=major gaps, 3=partial, 4=minor issues, 5=fully successful.\n"
              'Return JSON: {"score": <1-5>, "explanation": "<reason>"}'
          )
          result = litellm.completion(
              model=os.environ.get("EVAL_JUDGE_MODEL", "mistral/mistral-small-latest"),
              messages=[{"role": "user", "content": judge_prompt}],
              temperature=0,
              response_format={"type": "json_object"},
          )
          data = json.loads(result.choices[0].message.content)
          return {"score": data["score"], "explanation": data.get("explanation", "")}

