  - name: project_agent_contract
    custom_function: |
      def evaluate(instance):
          import json, os
          import litellm
          prompt = instance.get("prompt", "")
          resp = instance.get("response", {})
          if isinstance(resp, dict):
              response = " ".join(p.get("text", "") for p in resp.get("parts", []) if p.get("text"))
          else:
              response = str(resp)
          agent_data = json.dumps(instance.get("agent_data", {}))[:4000]
          rubrics = (
              instance.get("rubric_groups", {})
              .get("agent_contract", {})
              .get("rubrics", [])
          )
          rubric_lines = "\n".join(
              f"- {r['content']['property']['description']}"
              for r in rubrics
          )
          rubric_section = f"Case-specific rubrics:\n{rubric_lines}\n\n" if rubric_lines else ""
          judge_prompt = (
              "You are grading an ADK agent trace from this monorepo.\n\n"
              "Score whether the agent satisfied the user's intent while following the project contract.\n\n"
              "Global contract rules:\n"
              "- State and tool calls are the source of truth for rendered artifacts.\n"
              "- Artifact agents must write to state via domain tools, not paste full output into chat.\n"
              "- Auth-gated agents must not invent data when credentials are absent.\n"
              "- Agents must not book, mutate, or commit without explicit user approval.\n\n"
              + rubric_section
              + f"Prompt: {prompt}\n"
              f"Final response: {response}\n"
              f"Full trace: {agent_data}\n\n"
              'Return JSON: {"score": <1|2|3|4|5>, "explanation": "<one concise reason>"}'
          )
          result = litellm.completion(
              model=os.environ.get("EVAL_JUDGE_MODEL", "mistral/mistral-small-latest"),
              messages=[{"role": "user", "content": judge_prompt}],
              temperature=0,
              response_format={"type": "json_object"},
          )
          data = json.loads(result.choices[0].message.content)
          return {"score": data["score"], "explanation": data.get("explanation", "")}
