[project]
name = "collab-doc-agent"
version = "0.1.0"
description = "Collaborative document agent powered by Google ADK + CopilotKit AG-UI"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "python-dotenv",
  "pydantic",
  "google-adk",
  "google-genai",
  "ag-ui-adk",
  "litellm",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
app = "main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
