[project]
name = "collab-doc-agent"
version = "0.1.0"
description = "Collaborative document agent powered by Google ADK + CopilotKit AG-UI"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "python-dotenv",
  "pydantic",
  "google-adk>=1.32.0",
  "google-genai",
  "ag-ui-adk",
  "litellm",
  "opentelemetry-api",
  "opentelemetry-exporter-otlp-proto-http",
  "opentelemetry-sdk",
  "opentelemetry-instrumentation-google-genai>=0.4b0",
  "opentelemetry-instrumentation-sqlite3",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
app = "main:app"

[tool.setuptools]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
