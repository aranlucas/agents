[project]
name = "agent-common"
version = "0.1.0"
description = "Shared runtime helpers for the ADK agents"
requires-python = ">=3.14"
dependencies = [
  "a2a-sdk>=0.3.4,<0.4",
  "dependency-injector>=4.49.0",
  "google-adk[a2a]>=2.1.0",
  "google-genai",
  "asyncpg>=0.30.0",
  "sqlalchemy[asyncio]>=2.0",
  "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
