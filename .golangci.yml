# Keep golangci-lint in sync with .github/workflows/ci.yml (`version: v2.14`).
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - gocritic
    - intrange
    - misspell
    - modernize
    - noctx
    - nolintlint
    - perfsprint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - usestdlibvars
    - usetesting
    - wastedassign
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    staticcheck:
      # Doc comments are written where they help, not on every export.
      checks: ["all", "-ST1000", "-ST1020", "-ST1021", "-ST1022"]
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: unused-parameter
          disabled: true
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      # Tests may panic on unexpected shapes and use fixture credentials.
      - path: _test\.go
        linters: [forcetypeassert]

formatters:
  enable:
    - gofumpt
