name: CI

# Lints, typechecks, and tests the monorepo on every push to main and every
# pull request. Parallel jobs cut the critical path:
#   check   — turbo-driven lint/fmt/typecheck/coverage for JS workspaces
#   build   — deterministic JS builds (web, oral boards, and Worker views)
#   go      — the single Go lint/vet/race/build/vulnerability lane
#   docker  — Go-only gateway and Telegram image build/content/runtime smoke

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: JS lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Check JS workspaces
        run: pnpm exec turbo run lint fmt:check typecheck coverage --filter='!agents' --concurrency=2

  build:
    name: Build JS applications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Worker bindings
        working-directory: apps/ai-shopping-mcp
        run: pnpm exec wrangler types --check
      - name: Build
        # Mobile's `build` script is a credentialed EAS release operation, not
        # a deterministic compile. Its release workflows own that operation.
        run: pnpm exec turbo build --filter='!agents' --filter='!mobile'
        env:
          SKIP_ENV_VALIDATION: "1"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_placeholder
          GROQ_API_KEY: gsk_ci_placeholder

  docker:
    name: Build Go runtime images
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v6
      - name: Build gateway
        run: docker build -f agents/Dockerfile -t agents-gateway-go:ci .
      - name: Build Telegram
        run: docker build -f agents/Dockerfile.telegram -t agents-telegram-go:ci .
      - name: Smoke gateway
        run: bash agents/scripts/smoke-image.sh agents-gateway-go:ci
      - name: Smoke Telegram
        run: bash agents/scripts/smoke-telegram.sh agents-telegram-go:ci

  go:
    name: Go lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache-dependency-path: agents/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: agents
      - name: Format check
        working-directory: agents
        run: |
          unformatted="$(go run mvdan.cc/gofumpt@v0.10.0 -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofumpt needs to be run on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: Generated contract drift
        working-directory: agents
        run: go run ./cmd/contracts -check
      - name: Vet
        working-directory: agents
        run: go vet ./...
      - name: Race tests with coverage
        working-directory: agents
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build commands
        working-directory: agents
        run: CGO_ENABLED=0 go build -mod=readonly ./cmd/...
      - name: Vulnerability check
        working-directory: agents
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
