name: CI

# Lints, typechecks, and tests the monorepo on every push to main and every
# pull request. Three parallel jobs cut the critical path:
#   check   — turbo-driven lint/fmt/typecheck/coverage across every workspace
#             package (JS via pnpm, Python agents/ via uv), plus React Doctor
#   build   — next build (slowest step; runs in parallel with the others)
#   docker  — Dockerfile smoke-build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.19"
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm fmt:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Compile Python (catches syntax errors ruff misses)
        run: uv run python -m compileall -q agents packages
      - name: Tests (with Python coverage gate)
        run: pnpm coverage
      - name: React Doctor
        run: npx react-doctor@latest --scope changed

  build:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter web build
        env:
          SKIP_ENV_VALIDATION: "1"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_placeholder
          GROQ_API_KEY: gsk_ci_placeholder

  docker:
    name: Build agent image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Dockerfile
        run: docker build -f agents/Dockerfile .
