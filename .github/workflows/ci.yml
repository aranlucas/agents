name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  agent:
    name: Agent tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run agent tests
        working-directory: agent
        run: uv run --extra dev pytest

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - frontend
      - agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app image
        run: docker build -f docker/Dockerfile.app .

      - name: Build agent image
        run: docker build -f docker/Dockerfile.agent agent

  smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - containers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run compose smoke test
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
