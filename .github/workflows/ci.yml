name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    name: Go checks, race tests and binary build
    runs-on: ubuntu-latest
    env:
      GOMAXPROCS: "2"
      GOFLAGS: "-p=1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: --config=.golangci.yml --concurrency=2 ./... ./.railway
      - name: Check formatting, contracts and API
        run: |
          test -z "$(go run mvdan.cc/gofumpt@v0.11.0 -l cmd internal migrations .railway)"
          go vet ./... ./.railway
          go run ./cmd/contracts -check
          make api-check
      - run: make test
      - run: make build
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
