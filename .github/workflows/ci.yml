name: CI

# Lints, typechecks, and tests the monorepo on every push to main and every
# pull request. Parallel jobs cut the critical path:
#   check   — turbo-driven lint/fmt/typecheck/coverage across every workspace
#             package (JS via pnpm, Go agents via the agents workspace), plus React Doctor
#   build   — next build (slowest step; runs in parallel with the others)
#   docker  — Go-only gateway and Telegram image build/content/runtime smoke

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: agents/go.mod
          cache-dependency-path: agents/go.sum
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: agents
          args: --version
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm fmt:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm coverage
      - name: React Doctor
        run: npx react-doctor@latest --scope changed

  build:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter web build
        env:
          SKIP_ENV_VALIDATION: "1"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_placeholder
          GROQ_API_KEY: gsk_ci_placeholder

  docker:
    name: Build Go runtime images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build gateway
        run: docker build -f agents/Dockerfile -t agents-gateway-go:ci .
      - name: Build Telegram
        run: docker build -f agents/Dockerfile.telegram -t agents-telegram-go:ci .
      - name: Smoke gateway
        run: bash agents/scripts/smoke-image.sh agents-gateway-go:ci
      - name: Smoke Telegram
        run: bash agents/scripts/smoke-telegram.sh agents-telegram-go:ci

  go:
    name: Go runtimes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: agents/go.mod
          cache-dependency-path: agents/go.sum
      - name: Race tests
        working-directory: agents
        run: go test -race ./...
      - name: Vet
        working-directory: agents
        run: go vet ./...
      - name: Format check
        working-directory: agents
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to be run on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
