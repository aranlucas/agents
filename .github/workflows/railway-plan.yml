name: Railway plan

# Plans .railway/ changes on pull requests and uploads the pinned plan that
# railway-apply.yml applies after merge. See docs.railway.com/infrastructure-as-code.
on:
  pull_request:
    paths:
      - ".railway/**"
      - ".github/workflows/railway-*.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint Railway configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          args: ./.railway

  plan:
    name: Plan Railway configuration (${{ matrix.environment }})
    # Fork and Dependabot pull requests don't receive repository secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [development, production]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The CLI evaluates .railway/railway.go with go run.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: railwayapp/config@9e17d413dbe219f19d62538d9c06b5dbb5e9abf8 # v1.2.0
        with:
          command: plan
          railway-token: ${{ matrix.environment == 'production' && secrets.RAILWAY_TOKEN_PRODUCTION || secrets.RAILWAY_TOKEN_DEVELOPMENT }}
          cli-version: 5.62.1
          artifact-name: railway-plan-${{ matrix.environment }}
          plan-path: railway-plan-${{ matrix.environment }}.json
          # Both environments share one PR comment; show production's plan.
          comment: ${{ matrix.environment == 'production' }}
