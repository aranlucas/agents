name: Railway

on:
  push:
    branches: [main]
    paths:
      - ".railway/**"
      - ".github/workflows/railway.yml"
  workflow_dispatch:

concurrency:
  group: railway-config
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Apply Railway configuration
    runs-on: ubuntu-latest
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: cea909d4-f1d8-4bac-b480-c24e98528b5e
    steps:
      - name: Require a Railway workspace token
        run: |
          if [ -z "${RAILWAY_API_TOKEN:-}" ]; then
            echo "Add a workspace-scoped Railway token as the RAILWAY_API_TOKEN repository secret." >&2
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 24.19.0
      - name: Install Railway configuration dependencies
        run: pnpm install --frozen-lockfile

      - name: Link development
        run: >-
          pnpm dlx @railway/cli@latest link
          --project ${RAILWAY_PROJECT_ID}
          --environment development
          --service agents-gateway
      - name: Plan development
        run: >-
          pnpm dlx @railway/cli@latest config plan
      - name: Apply development
        run: >-
          pnpm dlx @railway/cli@latest config apply
          --yes

      - name: Link production
        run: >-
          pnpm dlx @railway/cli@latest link
          --project ${RAILWAY_PROJECT_ID}
          --environment production
          --service agents-gateway
      - name: Plan production
        run: >-
          pnpm dlx @railway/cli@latest config plan
      - name: Apply production
        run: >-
          pnpm dlx @railway/cli@latest config apply
          --yes
