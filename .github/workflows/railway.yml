name: Railway

on:
  push:
    branches: [main]
    paths:
      - ".railway/**"
      - ".github/workflows/railway.yml"
      - "Makefile"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

concurrency:
  group: railway-config
  cancel-in-progress: false

permissions:
  contents: read

env:
  RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
  # Pin the CLI alongside the Go SDK in the root go.mod.
  RAILWAY_CLI: "@railway/cli@5.62.1"

jobs:
  development:
    name: Apply Railway configuration (development)
    runs-on: ubuntu-latest
    steps:
      - name: Require a Railway workspace token
        run: |
          if [ -z "${RAILWAY_API_TOKEN:-}" ]; then
            echo "Add a workspace-scoped Railway token as the RAILWAY_API_TOKEN repository secret." >&2
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - name: Install the Railway CLI
        run: npm install --global "$RAILWAY_CLI"
      - name: Plan development
        run: make railway-plan ENV=development
      # Never confirms destructive changes; apply those locally with
      # make railway-apply ENV=development CONFIRM_DESTRUCTIVE=1.
      - name: Apply development
        run: make railway-apply ENV=development RAILWAY_APPLY_FLAGS=--yes

  production:
    name: Apply Railway configuration (production)
    needs: development
    runs-on: ubuntu-latest
    # Add required reviewers to this GitHub environment to gate production.
    environment: railway-production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - name: Install the Railway CLI
        run: npm install --global "$RAILWAY_CLI"
      - name: Plan production
        run: make railway-plan ENV=production
      # Never confirms destructive changes; apply those locally with
      # make railway-apply ENV=production CONFIRM_DESTRUCTIVE=1.
      - name: Apply production
        run: make railway-apply ENV=production RAILWAY_APPLY_FLAGS=--yes
