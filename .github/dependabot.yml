version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
  - package-ecosystem: gomod
    directory: /
    ignore:
      # Keep OpenAI SDK updates coordinated with ADK compatibility.
      - dependency-name: github.com/openai/openai-go/v3
    schedule:
      interval: weekly
      day: thursday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
