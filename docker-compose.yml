services:
  agents:
    build:
      context: .
      dockerfile: Dockerfile.agents
    ports:
      - "8000:8000"
    env_file:
      - path: ./.env
        required: false
      - path: ./.env.local
        required: false
    environment:
      OTEL_SERVICE_NAME: agents-gateway
      AGENT_DIR: agents/gateway
      AGENT_MODULE: gateway.main
      PORT: 8000
      ADK_SESSION_DB_PATH: /data/adk_sessions.sqlite
    volumes:
      - adk-session-data:/data

volumes:
  adk-session-data:
