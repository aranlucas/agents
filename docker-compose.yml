services:
  web-search:
    image: docker.io/mcp/brave-search:latest
    ports:
      - "8010:8000"
    env_file:
      - path: ./.env
        required: false
    environment:
      BRAVE_MCP_TRANSPORT: http
      BRAVE_MCP_PORT: 8000
      BRAVE_MCP_HOST: 0.0.0.0

  travel:
    build:
      context: ./agents/travel
    ports:
      - "8000:8000"
    env_file:
      - path: ./.env
        required: false
      - path: ./agents/travel/.env
        required: false
    environment:
      OTEL_SERVICE_NAME: travel-agent
      PORT: 8000

  grocery:
    build:
      context: ./agents/grocery
    ports:
      - "8001:8001"
    env_file:
      - path: ./.env
        required: false
      - path: ./agents/grocery/.env
        required: false
    environment:
      OTEL_SERVICE_NAME: grocery-agent
      PORT: 8001

  fitness:
    build:
      context: ./agents/fitness
    ports:
      - "8002:8002"
    env_file:
      - path: ./.env
        required: false
      - path: ./agents/fitness/.env
        required: false
    environment:
      OTEL_SERVICE_NAME: fitness-agent
      PORT: 8002
      WEB_SEARCH_MCP_URL: http://web-search:8000/mcp
    depends_on:
      - web-search
