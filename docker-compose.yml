services:
  agents:
    build:
      context: .
      dockerfile: agents/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: ./.env
        required: false
      - path: ./.env.local
        required: false
    environment:
      PORT: "8000"
      OTEL_SERVICE_NAME: agents-gateway

  telegram:
    build:
      context: .
      dockerfile: agents/Dockerfile.telegram
    ports:
      - "8082:8080"
    env_file:
      - path: ./.env
        required: false
      - path: ./.env.local
        required: false
    environment:
      PORT: "8080"
      OTEL_SERVICE_NAME: agents-telegram
