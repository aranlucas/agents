services:
  agents:
    build:
      context: .
      dockerfile: agents/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: ./.env
        required: false
      - path: ./.env.local
        required: false
    environment:
      APP_ENV: development
      PORT: "8000"
      OTEL_SERVICE_NAME: agents-gateway
      RAILWAY_ENVIRONMENT_ID: ""
      RAILWAY_ENVIRONMENT_NAME: ""
      RAILWAY_PROJECT_ID: ""
      RAILWAY_SERVICE_ID: ""

  telegram:
    build:
      context: .
      dockerfile: agents/Dockerfile.telegram
    ports:
      - "8082:8080"
    env_file:
      - path: ./.env
        required: false
      - path: ./.env.local
        required: false
    environment:
      APP_ENV: development
      PORT: "8080"
      OTEL_SERVICE_NAME: agents-telegram
      RAILWAY_ENVIRONMENT_ID: ""
      RAILWAY_ENVIRONMENT_NAME: ""
      RAILWAY_PROJECT_ID: ""
      RAILWAY_SERVICE_ID: ""
