services:
  travel:
    build:
      context: ./agents/travel
    ports:
      - "8000:8000"
    env_file:
      - path: ./.env
        required: false
      - path: ./agents/travel/.env
        required: false
    environment:
      OTEL_SERVICE_NAME: travel-agent
      PORT: 8000
      ADK_SESSION_DB_PATH: /data/adk_sessions.sqlite
    volumes:
      - adk-session-data:/data

  grocery:
    build:
      context: ./agents/grocery
    ports:
      - "8001:8001"
    env_file:
      - path: ./.env
        required: false
      - path: ./agents/grocery/.env
        required: false
    environment:
      OTEL_SERVICE_NAME: grocery-agent
      PORT: 8001
      ADK_SESSION_DB_PATH: /data/adk_sessions.sqlite
    volumes:
      - adk-session-data:/data

  fitness:
    build:
      context: ./agents/fitness
    ports:
      - "8002:8002"
    env_file:
      - path: ./.env
        required: false
      - path: ./agents/fitness/.env
        required: false
    environment:
      OTEL_SERVICE_NAME: fitness-agent
      PORT: 8002
      ADK_SESSION_DB_PATH: /data/adk_sessions.sqlite
    volumes:
      - adk-session-data:/data

  wellness:
    build:
      context: ./agents/wellness
    ports:
      - "8003:8003"
    env_file:
      - path: ./.env
        required: false
      - path: ./agents/wellness/.env
        required: false
    environment:
      OTEL_SERVICE_NAME: wellness-agent
      PORT: 8003
      ADK_SESSION_DB_PATH: /data/adk_sessions.sqlite
      GROCERY_AGENT_A2A_URL: http://grocery:8001/
      FITNESS_AGENT_A2A_URL: http://fitness:8002/
    volumes:
      - adk-session-data:/data

volumes:
  adk-session-data:
